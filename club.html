<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SR // ENCRYPTED_CHANNEL</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { mono: ['"Courier Prime"', 'monospace'] },
                    colors: { 
                        'term-bg': '#050505', 
                        'term-green': '#00ff41',
                        'term-red': '#ff3333',
                    },
                    animation: { 'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #000; color: #ccc; font-family: 'Courier Prime', monospace; font-size: 14px; overflow: hidden; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #333; }
        
        .onion-box { background: #080808; border: 1px solid #333; }
        .chat-bubble { max-width: 80%; padding: 8px 12px; margin-bottom: 8px; border: 1px solid #333; position: relative; }
        .chat-self { background: #1a1a1a; border-color: #00ff41; align-self: flex-end; text-align: right; margin-left: auto; }
        .chat-other { background: #0a0a0a; border-color: #444; align-self: flex-start; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-[#111] border-b border-[#333] p-2 flex justify-between items-center h-12 flex-shrink-0">
        <div class="flex items-center gap-2">
            <button onclick="window.location.href='dashboard.html'" class="text-xs text-gray-500 hover:text-white">[ < BACK ]</button>
            <span class="text-term-green font-bold">/// ENCRYPTED_CREW_CHAT</span>
        </div>
        <div class="text-[10px] text-gray-600" id="user-status">CONNECTED</div>
    </header>

    <!-- MAIN LAYOUT -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- SIDEBAR (CLUB LIST) -->
        <aside class="w-1/4 min-w-[80px] md:min-w-[200px] border-r border-[#333] bg-black flex flex-col">
            <div class="p-2 border-b border-[#333] text-xs text-gray-500 font-bold">MY_NODES</div>
            <div id="club-list" class="flex-1 overflow-y-auto">
                <!-- LIST CLUB DIMUAT DISINI -->
                <div class="p-4 text-[10px] text-gray-600 text-center">Scanning...</div>
            </div>
        </aside>

        <!-- CHAT AREA -->
        <main class="flex-1 flex flex-col bg-[#050505] relative">
            
            <!-- CHAT HEADER -->
            <div id="chat-header" class="h-12 border-b border-[#333] bg-[#0a0a0a] flex justify-between items-center px-4 hidden">
                <div class="flex flex-col">
                    <span id="active-club-name" class="text-white font-bold text-sm">SELECT CLUB</span>
                    <span class="text-[9px] text-term-green animate-pulse">SECURE CHANNEL ACTIVE</span>
                </div>
                <div class="flex gap-2">
                    <button id="btn-manage" onclick="openManageModal()" class="hidden border border-gray-600 text-gray-400 hover:text-white hover:border-white px-3 py-1 text-[10px]">[ MANAGE ]</button>
                    <button id="btn-leave" onclick="leaveClub()" class="border border-term-red text-term-red hover:bg-term-red hover:text-black px-3 py-1 text-[10px]">[ LEAVE ]</button>
                </div>
            </div>

            <!-- MESSAGES -->
            <div id="chat-container" class="flex-1 overflow-y-auto p-4 flex flex-col">
                <div class="m-auto text-gray-600 text-xs text-center">
                    <i data-lucide="radio" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
                    SELECT A CREW TO ESTABLISH LINK
                </div>
            </div>

            <!-- INPUT -->
            <div id="chat-input-area" class="p-3 border-t border-[#333] bg-black hidden">
                <div class="flex gap-2">
                    <input type="text" id="msg-input" class="flex-1 bg-[#111] border border-[#333] text-white text-sm p-2 outline-none focus:border-term-green font-mono placeholder-gray-700" placeholder="Encrypt message..." onkeydown="if(event.key === 'Enter') sendMessage()">
                    <button onclick="sendMessage()" class="bg-term-green text-black px-4 py-1 text-xs font-bold hover:bg-white transition">SEND</button>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL: MANAGE CLUB (ADMIN ONLY) -->
    <div id="modal-manage" class="modal-overlay hidden">
        <div class="onion-box w-[95%] max-w-lg bg-black h-[80vh] flex flex-col">
            <div class="p-3 border-b border-[#333] flex justify-between items-center">
                <span class="text-white font-bold">> CREW_MANAGEMENT_CONSOLE</span>
                <button onclick="document.getElementById('modal-manage').classList.add('hidden')" class="text-red-500">[ X ]</button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 space-y-6">
                
                <!-- REQUESTS -->
                <div>
                    <div class="text-xs text-yellow-500 mb-2 border-b border-yellow-900 pb-1">>> JOIN REQUESTS (PENDING)</div>
                    <div id="manage-requests" class="space-y-2">
                        <div class="text-[10px] text-gray-600">No incoming packets.</div>
                    </div>
                </div>

                <!-- MEMBERS -->
                <div>
                    <div class="text-xs text-term-green mb-2 border-b border-green-900 pb-1">>> ACTIVE OPERATIVES</div>
                    <div id="manage-members" class="space-y-2">
                        <!-- Members List -->
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // 1. CONFIG
        const SUPABASE_URL = 'https://zgnfpqqvacixawymldnb.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_6NbWkN7jwYH5fpBggGQisQ_7HXDHrNi'; 
        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let currentUser = null;
        let currentClubId = null;
        let currentRole = null;
        let chatInterval = null;

        // 2. INIT
        async function init() {
            const { data: { session } } = await sbClient.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            currentUser = session.user;

            // Get Name
            const { data: profile } = await sbClient.from('profiles').select('ic_name').eq('id', currentUser.id).single();
            currentUser.ic_name = profile ? profile.ic_name : "UNKNOWN";

            fetchMyClubs();
        }

        // 3. FETCH SIDEBAR CLUBS
        async function fetchMyClubs() {
            const list = document.getElementById('club-list');
            list.innerHTML = '';

            // Get clubs where user is 'member' or 'leader' (not pending)
            const { data: memberships } = await sbClient
                .from('crew_members')
                .select('*, crews(*)')
                .eq('user_id', currentUser.id)
                .in('status', ['member', 'leader']);

            if (!memberships || memberships.length === 0) {
                list.innerHTML = '<div class="p-4 text-[10px] text-gray-600 text-center">NO CREW AFFILIATION.<br>JOIN ONE IN DASHBOARD.</div>';
                return;
            }

            memberships.forEach(m => {
                const div = document.createElement('div');
                div.className = "p-3 border-b border-[#222] hover:bg-[#111] cursor-pointer transition flex items-center gap-2 group";
                // Style active state
                div.onclick = () => loadClubChat(m.crews.id, m.crews.name, m.status);
                
                div.innerHTML = `
                    <div class="w-2 h-2 bg-gray-600 rounded-full group-hover:bg-term-green"></div>
                    <div>
                        <div class="text-white text-xs font-bold truncate w-20 md:w-32">${m.crews.name}</div>
                        <div class="text-[9px] text-gray-500 uppercase">${m.status}</div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        // 4. LOAD CHAT
        async function loadClubChat(clubId, clubName, role) {
            currentClubId = clubId;
            currentRole = role;

            // UI Update
            document.getElementById('active-club-name').innerText = clubName;
            document.getElementById('chat-header').classList.remove('hidden');
            document.getElementById('chat-input-area').classList.remove('hidden');
            
            // Show Manage Button if Leader
            const btnManage = document.getElementById('btn-manage');
            if (role === 'leader') btnManage.classList.remove('hidden');
            else btnManage.classList.add('hidden');

            // Initial Fetch
            fetchMessages();

            // Auto Refresh Interval
            if (chatInterval) clearInterval(chatInterval);
            chatInterval = setInterval(fetchMessages, 3000); // 3 sec polling
        }

        async function fetchMessages() {
            if (!currentClubId) return;

            const container = document.getElementById('chat-container');
            
            const { data: messages } = await sbClient
                .from('club_messages')
                .select('*')
                .eq('club_id', currentClubId)
                .order('created_at', { ascending: true }) // Oldest top
                .limit(50);

            // Simple render diffing check (optional optimisation, here we just redraw for simplicity)
            container.innerHTML = ''; 

            if(!messages || messages.length === 0) {
                container.innerHTML = '<div class="text-center text-[10px] text-gray-600 mt-10">CHANNEL EMPTY. START TRANSMISSION.</div>';
                return;
            }

            messages.forEach(msg => {
                const isSelf = msg.user_id === currentUser.id;
                const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                const div = document.createElement('div');
                div.className = `chat-bubble ${isSelf ? 'chat-self' : 'chat-other'}`;
                div.innerHTML = `
                    <div class="text-[10px] font-bold mb-1 ${isSelf ? 'text-term-green' : 'text-gray-400'}">${msg.ic_name}</div>
                    <div class="text-sm text-white whitespace-pre-wrap">${msg.content}</div>
                    <div class="text-[8px] text-gray-600 text-right mt-1">${time}</div>
                `;
                container.appendChild(div);
            });

            // Scroll to bottom
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text || !currentClubId) return;

            input.value = ''; // Clear immediately

            await sbClient.from('club_messages').insert({
                club_id: currentClubId,
                user_id: currentUser.id,
                ic_name: currentUser.ic_name, // Real Identity in Club
                content: text
            });
            
            fetchMessages(); // Instant refresh
        }

        // 5. MEMBER MANAGEMENT
        async function openManageModal() {
            if (currentRole !== 'leader') return;
            document.getElementById('modal-manage').classList.remove('hidden');
            loadManageData();
        }

        async function loadManageData() {
            const reqList = document.getElementById('manage-requests');
            const memList = document.getElementById('manage-members');
            
            reqList.innerHTML = '<div class="text-[10px] text-gray-600">Scanning...</div>';
            memList.innerHTML = '<div class="text-[10px] text-gray-600">Scanning...</div>';

            // Fetch All Members
            const { data: members } = await sbClient
                .from('crew_members')
                .select('*')
                .eq('crew_id', currentClubId);

            reqList.innerHTML = '';
            memList.innerHTML = '';

            members.forEach(m => {
                // Template Item
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-[#111] p-2 border border-[#333]";
                
                if (m.status === 'pending') {
                    // REQUEST ITEM
                    div.innerHTML = `
                        <span class="text-white text-xs">${m.ic_name}</span>
                        <div class="flex gap-2">
                            <button onclick="decideMember('${m.user_id}', false)" class="text-red-500 text-[10px] border border-red-900 px-2 hover:bg-red-900 hover:text-white">DENY</button>
                            <button onclick="decideMember('${m.user_id}', true)" class="text-green-500 text-[10px] border border-green-900 px-2 hover:bg-green-900 hover:text-white">ACC</button>
                        </div>
                    `;
                    reqList.appendChild(div);
                } else {
                    // MEMBER ITEM
                    const kickBtn = m.status === 'leader' ? '<span class="text-[9px] text-gray-500">LEADER</span>' : 
                        `<button onclick="kickMember('${m.user_id}')" class="text-red-500 text-[10px] hover:underline">[ KICK ]</button>`;
                    
                    div.innerHTML = `
                        <span class="text-gray-300 text-xs">${m.ic_name}</span>
                        ${kickBtn}
                    `;
                    memList.appendChild(div);
                }
            });

            if (reqList.innerHTML === '') reqList.innerHTML = '<div class="text-[10px] text-gray-600 italic">No pending requests.</div>';
        }

        async function decideMember(userId, isAcc) {
            if (isAcc) {
                await sbClient.from('crew_members').update({ status: 'member' }).eq('crew_id', currentClubId).eq('user_id', userId);
            } else {
                await sbClient.from('crew_members').delete().eq('crew_id', currentClubId).eq('user_id', userId);
            }
            loadManageData(); // Refresh list
        }

        async function kickMember(userId) {
            if(!confirm("KICK THIS OPERATIVE?")) return;
            await sbClient.from('crew_members').delete().eq('crew_id', currentClubId).eq('user_id', userId);
            loadManageData();
        }

        // 6. LEAVE CLUB
        async function leaveClub() {
            if (currentRole === 'leader') {
                alert("LEADER CANNOT LEAVE. DISBAND CLUB INSTEAD (Not implemented yet).");
                return;
            }
            if(!confirm("ABORT MISSION & LEAVE CREW?")) return;

            await sbClient.from('crew_members').delete().eq('crew_id', currentClubId).eq('user_id', currentUser.id);
            window.location.reload(); // Refresh to update sidebar
        }

        init();
    </script>
</body>
</html>
