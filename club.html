<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SR // SECURE_CHANNEL</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { mono: ['"Courier Prime"', 'monospace'] },
                    colors: { 
                        'term-bg': '#050505', 
                        'term-green': '#00ff41',
                        'term-red': '#ff3333',
                        'term-dim': '#1a1a1a'
                    },
                    animation: { 
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'glitch': 'glitch 1s linear infinite'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #020202; color: #ccc; font-family: 'Courier Prime', monospace; font-size: 14px; overflow: hidden; }
        
        /* CUSTOM SCROLLBAR */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border: 1px solid #000; }
        
        /* CRT SCANLINE EFFECT */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
        }

        /* CHAT MESSAGE STYLES */
        .msg-box {
            margin-bottom: 12px;
            padding: 8px 12px;
            border: 1px solid #333;
            background: #080808;
            max-width: 85%;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        
        /* Self Message */
        .msg-self {
            align-self: flex-end;
            border-right: 3px solid #00ff41; /* Green Border Right */
            text-align: right;
            background: linear-gradient(90deg, #050505 0%, #0a1f0a 100%);
        }
        
        /* Other Message */
        .msg-other {
            align-self: flex-start;
            border-left: 3px solid #ff3333; /* Red Border Left */
            text-align: left;
            background: linear-gradient(90deg, #1a0505 0%, #050505 100%);
        }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
        .hidden { display: none !important; }
        
        /* Mobile Toggle */
        @media (max-width: 768px) {
            .sidebar-mobile { display: none; position: absolute; z-index: 40; width: 100%; height: 100%; background: #000; }
            .sidebar-mobile.open { display: flex; }
        }
    </style>
</head>
<body class="h-screen flex flex-col">

    <div class="scanlines"></div>

    <!-- HEADER -->
    <header class="bg-[#0a0a0a] border-b border-[#333] p-2 flex justify-between items-center h-14 flex-shrink-0 z-50">
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='dashboard.html'" class="text-xs text-gray-500 hover:text-white border border-[#333] px-2 py-1">[ BACK ]</button>
            <button onclick="toggleSidebar()" class="md:hidden text-term-green border border-term-green px-2 py-1 text-xs">[ NODES ]</button>
            <div class="flex flex-col">
                <span class="text-term-green font-bold text-sm tracking-widest">ENCRYPTED_LINK</span>
                <span class="text-[9px] text-gray-600">PROTOCOL: SR-V3 // <span id="user-status" class="text-gray-400">ONLINE</span></span>
            </div>
        </div>
        <div id="header-club-info" class="hidden md:flex items-center gap-4">
            <span id="active-club-header" class="text-gray-400 font-bold">NO_CONNECTION</span>
            <div class="w-2 h-2 bg-red-500 rounded-full animate-pulse" id="status-dot"></div>
        </div>
    </header>

    <!-- MAIN LAYOUT -->
    <div class="flex-1 flex overflow-hidden relative">
        
        <!-- SIDEBAR (CLUB LIST) -->
        <aside id="sidebar" class="sidebar-mobile md:flex md:w-1/4 md:min-w-[250px] border-r border-[#333] bg-black flex-col">
            <div class="p-3 border-b border-[#333] bg-[#050505]">
                <div class="text-xs text-gray-500 font-bold mb-1">AVAILABLE_NODES (CLUBS)</div>
                <div class="h-[1px] w-full bg-gradient-to-r from-term-green to-transparent"></div>
            </div>
            <div id="club-list" class="flex-1 overflow-y-auto p-2 space-y-2">
                <div class="p-4 text-[10px] text-gray-600 text-center animate-pulse">SCANNING FREQUENCIES...</div>
            </div>
        </aside>

        <!-- CHAT AREA -->
        <main class="flex-1 flex flex-col bg-[#020202] relative w-full">
            
            <!-- CHAT SUB-HEADER (Actions) -->
            <div id="chat-actions" class="h-10 border-b border-[#333] bg-[#050505] flex justify-between items-center px-4 hidden">
                <span class="text-[10px] text-gray-500">ID: <span id="current-club-id" class="text-gray-300">NULL</span></span>
                <div class="flex gap-2">
                    <button id="btn-manage" onclick="openManageModal()" class="hidden text-[10px] text-yellow-500 border border-yellow-900 px-3 py-0.5 hover:bg-yellow-900 hover:text-white transition">ADMIN_PANEL</button>
                    <button id="btn-leave" onclick="leaveClub()" class="text-[10px] text-term-red border border-red-900 px-3 py-0.5 hover:bg-red-900 hover:text-white transition">DISCONNECT</button>
                </div>
            </div>

            <!-- MESSAGES CONTAINER -->
            <div id="chat-container" class="flex-1 overflow-y-auto p-4 flex flex-col pb-4">
                <div class="m-auto text-gray-700 text-xs text-center font-mono">
                    <i data-lucide="shield-alert" class="w-12 h-12 mx-auto mb-3 opacity-30"></i>
                    <p>ESTABLISH CONNECTION WITH A NODE</p>
                    <p class="text-[9px] mt-1">SELECT A CLUB FROM THE LIST</p>
                </div>
            </div>

            <!-- INPUT AREA -->
            <div id="chat-input-area" class="p-3 border-t border-[#333] bg-black hidden">
                <div class="flex gap-0 items-stretch border border-[#333] bg-[#050505] focus-within:border-term-green transition-colors">
                    <div class="flex items-center px-3 bg-[#111] border-r border-[#333]">
                        <span class="text-term-green text-xs font-bold">></span>
                    </div>
                    <input type="text" id="msg-input" class="flex-1 bg-transparent text-white text-sm p-3 outline-none font-mono placeholder-gray-800" placeholder="Inject packet data..." onkeydown="if(event.key === 'Enter') sendMessage()">
                    <button onclick="sendMessage()" class="bg-[#111] text-gray-400 px-5 text-xs font-bold hover:text-white hover:bg-[#222] border-l border-[#333] transition">
                        SEND
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL: MANAGE CLUB -->
    <div id="modal-manage" class="modal-overlay hidden">
        <div class="onion-box w-[95%] max-w-lg bg-black flex flex-col border border-yellow-700 shadow-[0_0_20px_rgba(100,80,0,0.3)]">
            <div class="p-3 border-b border-yellow-900 flex justify-between items-center bg-yellow-900/10">
                <span class="text-yellow-500 font-bold tracking-widest text-sm">>> ADMIN_CONSOLE</span>
                <button onclick="document.getElementById('modal-manage').classList.add('hidden')" class="text-gray-500 hover:text-white">[X]</button>
            </div>
            
            <div class="p-4 space-y-6 max-h-[70vh] overflow-y-auto">
                <!-- REQUESTS -->
                <div>
                    <div class="flex justify-between items-end border-b border-[#333] pb-1 mb-2">
                        <span class="text-xs text-white font-bold">INCOMING_REQUESTS</span>
                        <span class="text-[9px] text-yellow-500 animate-pulse">PENDING</span>
                    </div>
                    <div id="manage-requests" class="space-y-1"></div>
                </div>

                <!-- MEMBERS -->
                <div>
                    <div class="flex justify-between items-end border-b border-[#333] pb-1 mb-2">
                        <span class="text-xs text-white font-bold">OPERATIVE_LIST</span>
                        <span class="text-[9px] text-term-green">ACTIVE</span>
                    </div>
                    <div id="manage-members" class="space-y-1"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const SUPABASE_URL = 'https://zgnfpqqvacixawymldnb.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_6NbWkN7jwYH5fpBggGQisQ_7HXDHrNi'; 
        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let currentUser = null;
        let currentClubId = null;
        let currentRole = null;
        let chatInterval = null;

        async function init() {
            const { data: { session } } = await sbClient.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            currentUser = session.user;

            const { data: profile } = await sbClient.from('profiles').select('ic_name').eq('id', currentUser.id).single();
            currentUser.ic_name = profile ? profile.ic_name : "UNKNOWN";

            fetchMyClubs();
        }

        // TOGGLE SIDEBAR FOR MOBILE
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        async function fetchMyClubs() {
            const list = document.getElementById('club-list');
            
            const { data: memberships } = await sbClient
                .from('crew_members')
                .select('*, crews(*)')
                .eq('user_id', currentUser.id)
                .in('status', ['member', 'leader']);

            list.innerHTML = '';
            if (!memberships || memberships.length === 0) {
                list.innerHTML = '<div class="p-4 text-[10px] text-gray-700 text-center border border-[#222]">NO CONNECTIONS FOUND</div>';
                return;
            }

            memberships.forEach(m => {
                const div = document.createElement('div');
                div.className = "p-3 border border-[#222] bg-[#080808] hover:border-term-green cursor-pointer transition mb-2 group relative overflow-hidden";
                div.onclick = () => {
                    loadClubChat(m.crews.id, m.crews.name, m.status);
                    if(window.innerWidth < 768) toggleSidebar(); // Close sidebar on mobile select
                };
                
                div.innerHTML = `
                    <div class="absolute left-0 top-0 bottom-0 w-1 bg-gray-800 group-hover:bg-term-green transition-colors"></div>
                    <div class="pl-3">
                        <div class="text-white text-xs font-bold font-mono tracking-wider group-hover:text-term-green">${m.crews.name}</div>
                        <div class="text-[9px] text-gray-600 font-mono flex justify-between mt-1">
                            <span>ROLE: ${m.status.toUpperCase()}</span>
                            <span>[CONNECT]</span>
                        </div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        async function loadClubChat(clubId, clubName, role) {
            currentClubId = clubId;
            currentRole = role;

            // Update Headers
            document.getElementById('active-club-header').innerText = clubName;
            document.getElementById('active-club-header').classList.remove('text-gray-400');
            document.getElementById('active-club-header').classList.add('text-white');
            document.getElementById('status-dot').className = "w-2 h-2 bg-term-green rounded-full shadow-[0_0_5px_#00ff41]";
            document.getElementById('current-club-id').innerText = clubId.substring(0, 8);

            // Show Areas
            document.getElementById('chat-actions').classList.remove('hidden');
            document.getElementById('chat-input-area').classList.remove('hidden');
            
            // Manage Button
            const btnManage = document.getElementById('btn-manage');
            if (role === 'leader') btnManage.classList.remove('hidden');
            else btnManage.classList.add('hidden');

            // Load Messages
            fetchMessages();
            if (chatInterval) clearInterval(chatInterval);
            chatInterval = setInterval(fetchMessages, 3000);
        }

        async function fetchMessages() {
            if (!currentClubId) return;
            const container = document.getElementById('chat-container');
            
            const { data: messages } = await sbClient
                .from('club_messages')
                .select('*')
                .eq('club_id', currentClubId)
                .order('created_at', { ascending: true })
                .limit(50);

            container.innerHTML = ''; 

            if(!messages || messages.length === 0) {
                container.innerHTML = '<div class="text-center text-[10px] text-gray-700 mt-20 font-mono">CHANNEL INITIALIZED. WAITING FOR PACKETS...</div>';
                return;
            }

            messages.forEach(msg => {
                const isSelf = msg.user_id === currentUser.id;
                const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                // --- TERMINAL STYLE MESSAGE ---
                const div = document.createElement('div');
                div.className = `msg-box ${isSelf ? 'msg-self' : 'msg-other'}`;
                
                const senderColor = isSelf ? 'text-term-green' : 'text-term-red';
                const senderLabel = isSelf ? 'YOU' : msg.ic_name;

                div.innerHTML = `
                    <div class="flex justify-between items-end border-b border-gray-800 pb-1 mb-1">
                        <span class="text-[10px] font-bold font-mono tracking-wider ${senderColor}">${senderLabel}</span>
                        <span class="text-[8px] text-gray-600 font-mono">${time}</span>
                    </div>
                    <div class="text-sm text-gray-300 font-mono whitespace-pre-wrap leading-tight">${msg.content}</div>
                `;
                container.appendChild(div);
            });

            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text || !currentClubId) return;

            input.value = '';

            await sbClient.from('club_messages').insert({
                club_id: currentClubId,
                user_id: currentUser.id,
                ic_name: currentUser.ic_name, 
                content: text
            });
            fetchMessages(); 
        }

        // --- MANAGEMENT LOGIC ---
        async function openManageModal() {
            if (currentRole !== 'leader') return;
            document.getElementById('modal-manage').classList.remove('hidden');
            loadManageData();
        }

        async function loadManageData() {
            const reqList = document.getElementById('manage-requests');
            const memList = document.getElementById('manage-members');
            
            reqList.innerHTML = '<div class="text-[10px] text-gray-600">Scanning...</div>';
            memList.innerHTML = '<div class="text-[10px] text-gray-600">Scanning...</div>';

            const { data: members } = await sbClient.from('crew_members').select('*').eq('crew_id', currentClubId);

            reqList.innerHTML = '';
            memList.innerHTML = '';

            members.forEach(m => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-[#111] p-2 border border-[#333] mb-1";
                
                if (m.status === 'pending') {
                    div.innerHTML = `
                        <div class="flex items-center gap-2">
                            <i data-lucide="help-circle" class="w-3 h-3 text-yellow-500"></i>
                            <span class="text-white text-xs font-mono">${m.ic_name}</span>
                        </div>
                        <div class="flex gap-1">
                            <button onclick="decideMember('${m.user_id}', false)" class="text-red-500 text-[9px] border border-red-900 px-2 py-0.5 hover:bg-red-900 hover:text-white">DENY</button>
                            <button onclick="decideMember('${m.user_id}', true)" class="text-green-500 text-[9px] border border-green-900 px-2 py-0.5 hover:bg-green-900 hover:text-white">ACC</button>
                        </div>
                    `;
                    reqList.appendChild(div);
                } else {
                    const kickBtn = m.status === 'leader' ? '<span class="text-[9px] text-yellow-500 font-bold">LEADER</span>' : 
                        `<button onclick="kickMember('${m.user_id}')" class="text-red-500 text-[9px] border border-red-900 px-2 hover:bg-red-900 hover:text-white">[ PURGE ]</button>`;
                    
                    div.innerHTML = `
                        <div class="flex items-center gap-2">
                            <div class="w-1.5 h-1.5 bg-term-green rounded-full"></div>
                            <span class="text-gray-300 text-xs font-mono">${m.ic_name}</span>
                        </div>
                        ${kickBtn}
                    `;
                    memList.appendChild(div);
                }
            });
            if (reqList.innerHTML === '') reqList.innerHTML = '<div class="text-[10px] text-gray-700 italic border border-[#222] p-2 text-center">NO DATA</div>';
            lucide.createIcons();
        }

        async function decideMember(userId, isAcc) {
            if (isAcc) await sbClient.from('crew_members').update({ status: 'member' }).eq('crew_id', currentClubId).eq('user_id', userId);
            else await sbClient.from('crew_members').delete().eq('crew_id', currentClubId).eq('user_id', userId);
            loadManageData();
        }

        async function kickMember(userId) {
            if(!confirm("CONFIRM: REMOVE OPERATIVE FROM NODE?")) return;
            await sbClient.from('crew_members').delete().eq('crew_id', currentClubId).eq('user_id', userId);
            loadManageData();
        }

        async function leaveClub() {
            if (currentRole === 'leader') return alert("ERROR: LEADER MUST TRANSFER OWNERSHIP OR DELETE NODE.");
            if(!confirm("WARNING: SEVERING CONNECTION WITH THIS NODE?")) return;
            await sbClient.from('crew_members').delete().eq('crew_id', currentClubId).eq('user_id', currentUser.id);
            window.location.reload();
        }

        init();
    </script>
</body>
</html>
