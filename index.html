<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREETRACER.NET // ENCRYPTED GATEWAY</title>
    
    <!-- 1. TAILWIND CSS (Styling) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. SUPABASE JS (Database) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 3. FONT: JETBRAINS MONO (Hacker Style) -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- 4. CONFIG TAILWIND -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { mono: ['"JetBrains Mono"', 'monospace'] },
                    colors: {
                        'neon-red': '#ff003c',
                        'dark-bg': '#050505',
                        'panel-bg': '#0a0a0a',
                    },
                    animation: {
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <!-- 5. CUSTOM CSS (Efek Visual) -->
    <style>
        /* Efek Garis Scanline ala TV Tua */
        .scanline {
            width: 100%; height: 100px; z-index: 10;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(255, 0, 60, 0.03) 50%, rgba(0,0,0,0) 100%);
            opacity: 0.1; position: absolute; bottom: 100%;
            animation: scanline 10s linear infinite; pointer-events: none;
        }
        @keyframes scanline { 0% { bottom: 100%; } 100% { bottom: -100%; } }
        
        /* Loading Spinner */
        .loader {
            border: 2px solid #333; border-top: 2px solid #ff003c;
            border-radius: 50%; width: 14px; height: 14px;
            animation: spin 1s linear infinite; display: inline-block; vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Input Autofill Fix (Biar gak jadi putih backgroundnya) */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #000 inset !important;
            -webkit-text-fill-color: white !important;
            caret-color: white;
        }
    </style>
</head>
<body class="bg-dark-bg text-gray-300 font-mono min-h-screen flex flex-col items-center justify-center relative overflow-hidden selection:bg-neon-red selection:text-white">

    <!-- Background Grid -->
    <div class="absolute inset-0 bg-[linear-gradient(to_right,#111_1px,transparent_1px),linear-gradient(to_bottom,#111_1px,transparent_1px)] bg-[size:24px_24px] -z-10"></div>
    <div class="scanline"></div>

    <!-- NOTIFICATION AREA (Hidden by default) -->
    <div id="notification-area" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 w-[90%] max-w-sm transition-all duration-300 opacity-0 pointer-events-none translate-y-[-20px]">
        <div id="notif-box" class="bg-black border-l-4 border-neon-red p-4 shadow-[0_0_30px_rgba(0,0,0,1)] flex items-start gap-3">
            <div id="notif-icon" class="text-neon-red text-xl font-bold">⚠️</div>
            <div>
                <h4 id="notif-title" class="text-white text-xs font-bold uppercase tracking-wider mb-1">SYSTEM ALERT</h4>
                <p id="notif-msg" class="text-zinc-400 text-[10px] leading-tight">Access Denied.</p>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="w-full max-w-md p-4 relative z-20">
        
        <!-- Header / Logo -->
        <div class="text-center mb-8 select-none">
            <div class="inline-block px-3 py-1 border border-neon-red/30 rounded-full mb-3 bg-red-900/10">
                <span class="w-2 h-2 rounded-full bg-red-600 inline-block animate-pulse-fast mr-2"></span>
                <span class="text-[10px] text-neon-red uppercase tracking-widest">Live Node</span>
            </div>
            <h1 class="text-3xl font-bold tracking-tighter text-white drop-shadow-[0_0_10px_rgba(255,0,60,0.5)]">
                STREETRACER<span class="text-neon-red">.NET</span>
            </h1>
            <p class="text-[10px] text-zinc-500 uppercase mt-2 tracking-[0.2em]">San Andreas Underground Network</p>
        </div>

        <!-- Auth Box -->
        <div class="bg-panel-bg border border-zinc-800 shadow-[0_0_40px_rgba(0,0,0,0.5)] rounded-sm overflow-hidden relative">
            
            <!-- Tabs (Login vs Register) -->
            <div class="flex border-b border-zinc-800">
                <button onclick="switchTab('login')" id="tab-login" class="flex-1 py-4 text-xs font-bold bg-zinc-900 text-white border-b-2 border-neon-red transition-all tracking-widest hover:bg-zinc-800">
                    // LOGIN
                </button>
                <button onclick="switchTab('register')" id="tab-register" class="flex-1 py-4 text-xs font-bold bg-dark-bg text-zinc-600 border-b-2 border-transparent hover:text-white transition-all tracking-widest hover:bg-zinc-900">
                    // REGISTER
                </button>
            </div>

            <!-- Content Area -->
            <div class="p-8">
                
                <!-- LOGIN FORM -->
                <form id="form-login" class="space-y-5 block animate-[fadeIn_0.3s_ease-out]">
                    <div>
                        <label class="block text-[10px] uppercase text-zinc-500 mb-1 tracking-wider">Identity (Email)</label>
                        <div class="relative">
                            <input type="email" id="login-email" placeholder="user@streetracer.net" class="w-full bg-black border border-zinc-800 p-3 text-sm focus:border-neon-red focus:outline-none focus:shadow-[0_0_15px_rgba(255,0,60,0.2)] text-white transition-all placeholder-zinc-800" required>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase text-zinc-500 mb-1 tracking-wider">Passphrase</label>
                        <input type="password" id="login-password" placeholder="••••••••••••" class="w-full bg-black border border-zinc-800 p-3 text-sm focus:border-neon-red focus:outline-none focus:shadow-[0_0_15px_rgba(255,0,60,0.2)] text-white transition-all placeholder-zinc-800" required>
                    </div>
                    
                    <button type="submit" id="btn-login" class="w-full bg-neon-red text-black font-bold py-3 mt-2 hover:bg-white hover:shadow-[0_0_20px_rgba(255,255,255,0.4)] transition-all text-xs tracking-[0.2em] uppercase clip-path-polygon">
                        Decrypt & Enter
                    </button>
                </form>

                <!-- REGISTER FORM -->
                <form id="form-register" class="space-y-4 hidden animate-[fadeIn_0.3s_ease-out]">
                    <div class="p-3 bg-red-950/20 border border-red-900/30 text-red-500 text-[10px] mb-2 flex items-center gap-2">
                        <span>⚠️</span>
                        <span>REQUIREMENT: Domain <b>@streetracer.net</b></span>
                    </div>

                    <div>
                        <label class="block text-[10px] uppercase text-zinc-500 mb-1 tracking-wider">IC Name (SAMP)</label>
                        <input type="text" id="reg-icname" placeholder="Toretto_Dominic" class="w-full bg-black border border-zinc-800 p-3 text-sm focus:border-neon-red focus:outline-none text-white transition-all placeholder-zinc-800" required>
                    </div>

                    <div>
                        <label class="block text-[10px] uppercase text-zinc-500 mb-1 tracking-wider">Secure Email</label>
                        <input type="email" id="reg-email" placeholder="name@streetracer.net" class="w-full bg-black border border-zinc-800 p-3 text-sm focus:border-neon-red focus:outline-none text-white transition-all placeholder-zinc-800" required>
                    </div>
                    
                    <div>
                        <label class="block text-[10px] uppercase text-zinc-500 mb-1 tracking-wider">Set Password</label>
                        <input type="password" id="reg-password" placeholder="••••••••••••" class="w-full bg-black border border-zinc-800 p-3 text-sm focus:border-neon-red focus:outline-none text-white transition-all placeholder-zinc-800" required>
                    </div>

                    <button type="submit" id="btn-register" class="w-full border border-neon-red text-neon-red font-bold py-3 mt-2 hover:bg-neon-red hover:text-black hover:shadow-[0_0_20px_rgba(255,0,60,0.4)] transition-all text-xs tracking-[0.2em] uppercase">
                        Initiate Protocol
                    </button>
                </form>

            </div>

            <!-- Footer Status -->
            <div class="bg-black py-2 px-4 border-t border-zinc-900 flex justify-between items-center text-[9px] text-zinc-700 uppercase tracking-widest">
                <span>Status: UNSECURED</span>
                <span>v3.0.1</span>
            </div>
        </div>
        
        <p class="text-center text-[10px] text-zinc-800 mt-6">
            UNAUTHORIZED ACCESS IS A FEDERAL OFFENSE. <br> IP ADDRESS LOGGED.
        </p>

    </div>

    <!-- ============================================== -->
    <!-- LOGIC JAVASCRIPT (WAJIB EDIT BAGIAN BAWAH) -->
    <!-- ============================================== -->
    <script>
        // ================================================
        // 1. CONFIG: MASUKKAN KUNCI SUPABASE DI SINI !!!
        // ================================================
        const SUPABASE_URL = 'https://zgnfpqqvacixawymldnb.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_6NbWkN7jwYH5fpBggGQisQ_7HXDHrNi';
        
        // ================================================
        // 2. HELPER FUNCTIONS (UI Logic)
        // ================================================
        
        // Fungsi Notifikasi Popup
        function showNotification(title, message, type = 'error') {
            const area = document.getElementById('notification-area');
            const box = document.getElementById('notif-box');
            const titleEl = document.getElementById('notif-title');
            const msgEl = document.getElementById('notif-msg');
            const iconEl = document.getElementById('notif-icon');

            titleEl.textContent = title;
            msgEl.textContent = message;
            
            // Tampilkan (Hapus class hidden/opacity)
            area.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            area.classList.add('opacity-100', 'translate-y-0');

            // Ganti Warna berdasarkan tipe
            if (type === 'success') {
                box.classList.replace('border-neon-red', 'border-green-500');
                iconEl.textContent = '✓';
                iconEl.className = 'text-green-500 text-xl font-bold';
            } else {
                box.classList.replace('border-green-500', 'border-neon-red');
                iconEl.textContent = '⚠️';
                iconEl.className = 'text-neon-red text-xl font-bold';
            }

            // Hilangkan otomatis setelah 3.5 detik
            setTimeout(() => {
                area.classList.remove('opacity-100', 'translate-y-0');
                area.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            }, 3500);
        }

        // Fungsi Loading Tombol
        function setLoading(btnId, isLoading, defaultText) {
            const btn = document.getElementById(btnId);
            if (!btn) return;

            if (isLoading) {
                btn.innerHTML = '<span class="loader mr-2"></span> PROCESSING...';
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                btn.innerHTML = defaultText;
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        // Fungsi Ganti Tab
        window.switchTab = function(tab) {
            const loginForm = document.getElementById('form-login');
            const registerForm = document.getElementById('form-register');
            const loginTab = document.getElementById('tab-login');
            const registerTab = document.getElementById('tab-register');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                
                loginTab.classList.add('bg-zinc-900', 'text-white', 'border-neon-red');
                loginTab.classList.remove('bg-dark-bg', 'text-zinc-600', 'border-transparent');
                
                registerTab.classList.remove('bg-zinc-900', 'text-white', 'border-neon-red');
                registerTab.classList.add('bg-dark-bg', 'text-zinc-600', 'border-transparent');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                
                registerTab.classList.add('bg-zinc-900', 'text-white', 'border-neon-red');
                registerTab.classList.remove('bg-dark-bg', 'text-zinc-600', 'border-transparent');
                
                loginTab.classList.remove('bg-zinc-900', 'text-white', 'border-neon-red');
                loginTab.classList.add('bg-dark-bg', 'text-zinc-600', 'border-transparent');
            }
        }

        // ================================================
        // 3. MAIN LOGIC (Eksekusi saat halaman siap)
        // ================================================
        document.addEventListener('DOMContentLoaded', () => {
            console.log("System Initializing...");

            // Cek Kunci API
            if (!SUPABASE_URL || !SUPABASE_KEY || SUPABASE_URL.includes("MASUKKAN")) {
                showNotification("SYSTEM ERROR", "Supabase API Key not configured in code!", "error");
                document.getElementById('btn-login').disabled = true;
                document.getElementById('btn-register').disabled = true;
                return;
            }

            // Init Supabase
            let supabase;
            try {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log("Database Connection: OK");
            } catch (err) {
                console.error(err);
                showNotification("CONNECTION FAILED", "Could not reach database.");
                return;
            }

            // --- EVENT: LOGIN ---
            const loginForm = document.getElementById('form-login');
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;

                setLoading('btn-login', true, 'DECRYPT & ENTER');

                // Validasi Domain
                if (!email.includes('@streetracer.net')) {
                    showNotification('ACCESS DENIED', 'Invalid Domain. Use @streetracer.net identity.');
                    setLoading('btn-login', false, 'DECRYPT & ENTER');
                    return;
                }

                try {
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: email,
                        password: password,
                    });

                    if (error) throw error;

                    showNotification('ACCESS GRANTED', 'Decryption successful. Redirecting...', 'success');
                    
                    // Redirect setelah 1.5 detik
                    setTimeout(() => {
                        window.location.href = 'dashboard.html'; 
                    }, 1500);

                } catch (error) {
                    let msg = error.message;
                    if(msg.includes('Invalid login')) msg = "Incorrect identity or passphrase.";
                    showNotification('LOGIN FAILED', msg);
                } finally {
                    setLoading('btn-login', false, 'DECRYPT & ENTER');
                }
            });

            // --- EVENT: REGISTER ---
            const registerForm = document.getElementById('form-register');
            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                console.log("Registration Initiated");

                const email = document.getElementById('reg-email').value;
                const password = document.getElementById('reg-password').value;
                const icName = document.getElementById('reg-icname').value;

                setLoading('btn-register', true, 'INITIATE PROTOCOL');

                // Validasi Domain
                if (!email.endsWith('@streetracer.net')) {
                    showNotification('PROTOCOL VIOLATION', 'Registration requires an @streetracer.net email.');
                    setLoading('btn-register', false, 'INITIATE PROTOCOL');
                    return;
                }

                try {
                    const { data, error } = await supabase.auth.signUp({
                        email: email,
                        password: password,
                        options: {
                            data: { ic_name: icName } // Simpan IC Name di metadata
                        }
                    });

                    if (error) throw error;

                    showNotification('IDENTITY ESTABLISHED', 'Verification link sent to your secure inbox.', 'success');
                    setTimeout(() => switchTab('login'), 2000);

                } catch (error) {
                    console.error(error);
                    showNotification('REGISTRATION ERROR', error.message);
                } finally {
                    setLoading('btn-register', false, 'INITIATE PROTOCOL');
                }
            });
        });
    </script>
</body>
</html>
