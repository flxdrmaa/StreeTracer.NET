<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREETRACER.NET // LS_UNDERGROUND</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Courier New', monospace; background: #050505; color: #00ff41; }
        .neon-border { border: 1px solid #00ff41; box-shadow: 0 0 10px rgba(0,255,65,0.2); }
        .hidden { display: none; }
        input, textarea { background: #0a0a0a !important; border: 1px solid #1a1a1a !important; color: #00ff41 !important; outline: none; padding: 8px; }
        input:focus { border-color: #00ff41 !important; }
        .post-card { border-left: 3px solid #00ff41; background: rgba(0, 255, 65, 0.02); padding: 15px; margin-bottom: 20px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- GATE: LOGIN -->
    <div id="auth-gate" class="max-w-md mx-auto mt-20 p-6 neon-border bg-black">
        <h1 class="text-center font-bold mb-6 text-xl tracking-[0.3em]">STREETRACER.NET</h1>
        <div class="flex border-b border-green-900 mb-6 text-[10px]">
            <button onclick="setAuthMode('login')" id="btn-login" class="flex-1 py-2 bg-green-900 text-black font-bold">LOGIN</button>
            <button onclick="setAuthMode('register')" id="btn-reg" class="flex-1 py-2 hover:bg-green-900/20">REGISTER</button>
        </div>
        <div class="space-y-4">
            <input type="email" id="email" placeholder="RACER_EMAIL" class="w-full text-sm">
            <input type="password" id="password" placeholder="ACCESS_CODE" class="w-full text-sm">
            <button onclick="handleAuth()" class="w-full bg-green-900 text-black font-bold py-2 text-xs uppercase hover:bg-green-400">[ Execute_Infiltration ]</button>
        </div>
        <p id="auth-msg" class="text-[10px] text-red-600 mt-4 text-center"></p>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard" class="hidden max-w-6xl mx-auto">
        <header class="flex justify-between items-center border-b border-green-900 pb-4 mb-8">
            <div class="text-[10px] font-bold">
                CONNECTED_AS: <span id="user-display" class="text-white"></span>
            </div>
            <button onclick="logout()" class="text-[10px] text-red-600 underline">[ TERMINATE_SESSION ]</button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
            <!-- Sidebar Navigation -->
            <div class="space-y-2">
                <button onclick="showTab('feed')" class="w-full text-left p-2 bg-green-900 text-black text-xs font-bold uppercase">>> GLOBAL_FEED</button>
                <button onclick="showTab('clubs')" class="w-full text-left p-2 border border-green-900 text-xs font-bold uppercase hover:bg-green-900/10">>> DIRECTORY_CLUBS</button>
                <div id="leader-section" class="hidden pt-4">
                    <p class="text-[10px] text-red-600 font-bold mb-2">// CREW_ADMIN_PANEL</p>
                    <button onclick="showTab('admin')" class="w-full text-left p-2 border border-red-900 text-xs text-red-500 font-bold uppercase hover:bg-red-900/10">>> MANAGE_REQUESTS</button>
                </div>
            </div>

            <!-- Tab: Global Feed -->
            <div id="tab-feed" class="md:col-span-3 space-y-6">
                <div class="border border-green-900 p-4 bg-black">
                    <p class="text-[10px] text-zinc-600 mb-2 uppercase font-bold">// Create_Transmission</p>
                    <textarea id="post-content" class="w-full text-xs h-20 mb-2" placeholder="Intel, Race Invites..."></textarea>
                    <input type="text" id="post-img" class="w-full text-[10px]" placeholder="Direct Image Link (i.ibb.co/xyz.jpg)">
                    <button onclick="submitPost()" class="mt-4 bg-green-900 text-black px-6 py-1 text-xs font-bold uppercase hover:bg-green-400">Broadcast</button>
                </div>
                <div id="feed-items">
                    <p class="text-[10px] animate-pulse">Scanning for incoming data...</p>
                </div>
            </div>

            <!-- Tab: Clubs -->
            <div id="tab-clubs" class="hidden md:col-span-3 space-y-6">
                <div class="border border-green-900 p-4 bg-black">
                    <h3 class="text-xs font-bold mb-4 italic text-green-700 underline">// ESTABLISH_NEW_CREW</h3>
                    <input type="text" id="crew-name" class="w-full text-xs mb-2" placeholder="CREW_NAME">
                    <textarea id="crew-desc" class="w-full text-xs h-16 mb-2" placeholder="CREW_DESCRIPTION"></textarea>
                    <button onclick="registerCrew()" class="bg-green-900 text-black px-6 py-1 text-xs font-bold uppercase">Register_Crew</button>
                </div>
                <div id="clubs-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>

            <!-- Tab: Admin (Leader Only) -->
            <div id="tab-admin" class="hidden md:col-span-3 space-y-4">
                <h2 class="text-sm font-bold bg-red-900 text-black p-2 uppercase italic">Pending_Infiltration_Requests</h2>
                <div id="pending-requests" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://zgnfpqqvacixawymldnb.supabase.co";
        const SB_KEY = "sb_secret_MLMH_o1tS5UZe_Us8uriIA_hAEpx0eY";
        const DISCORD_WEBHOOK = "YOUR_DISCORD_WEBHOOK";

        const supabase = supabase.createClient(SB_URL, SB_KEY);
        let authMode = 'login';
        let userEmail = "";

        // --- AUTH ---
        function setAuthMode(m) {
            authMode = m;
            document.getElementById('btn-login').className = m === 'login' ? 'flex-1 py-2 bg-green-900 text-black font-bold' : 'flex-1 py-2 hover:bg-green-900/20';
            document.getElementById('btn-reg').className = m === 'register' ? 'flex-1 py-2 bg-green-900 text-black font-bold' : 'flex-1 py-2 hover:bg-green-900/20';
        }

        async function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('auth-msg');

            const { data, error } = authMode === 'login' 
                ? await supabase.auth.signInWithPassword({ email, password })
                : await supabase.auth.signUp({ email, password });

            if(error) msg.innerText = "ACCESS_DENIED: " + error.message;
            else location.reload();
        }

        async function checkUser() {
            const { data: { user } } = await supabase.auth.getUser();
            if(user) {
                userEmail = user.email;
                document.getElementById('auth-gate').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                document.getElementById('user-display').innerText = user.email.split('@')[0].toUpperCase();
                loadFeed();
                checkIfLeader();
            }
        }

        function logout() { supabase.auth.signOut(); location.reload(); }

        // --- FEED LOGIC ---
        async function loadFeed() {
            const { data: posts } = await supabase.from('posts').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('feed-items');
            container.innerHTML = posts.map(p => `
                <div class="post-card">
                    <div class="flex justify-between text-[9px] mb-2 font-bold italic text-green-800">
                        <span>@${p.username}</span>
                        <span>${new Date(p.created_at).toLocaleString()}</span>
                    </div>
                    <p class="text-xs mb-3 text-zinc-300">${p.content}</p>
                    ${p.image_url ? `<img src="${p.image_url}" class="w-full border border-zinc-900 opacity-70">` : ''}
                </div>
            `).join('');
        }

        async function submitPost() {
            const content = document.getElementById('post-content').value;
            const img = document.getElementById('post-img').value;
            const username = userEmail.split('@')[0];

            if(!content) return;

            const { error } = await supabase.from('posts').insert([{ username, content, image_url: img }]);
            if(!error) {
                sendDiscordNotif(content);
                document.getElementById('post-content').value = "";
                document.getElementById('post-img').value = "";
                loadFeed();
            }
        }

        // --- DISCORD WEBHOOK (MASKED) ---
        async function sendDiscordNotif(text) {
            const masked = "OPERATOR_" + Math.random().toString(36).substring(7).toUpperCase();
            const payload = {
                username: "WATCHDOG",
                embeds: [{
                    title: "🚨 TRANSMISI BARU",
                    description: `**PENGIRIM:** \`${masked}\`\n\n**DATA:**\n"${text}"\n\n[OPEN_NETWORK](https://streetracer.vercel.app)`,
                    color: 3066993,
                    timestamp: new Date()
                }]
            };
            await fetch(DISCORD_WEBHOOK, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
        }

        // --- CLUBS LOGIC ---
        async function loadClubs() {
            const { data: clubs } = await supabase.from('crews').select('*');
            const list = document.getElementById('clubs-list');
            list.innerHTML = clubs.map(c => `
                <div class="border border-zinc-800 p-4 bg-zinc-900/10">
                    <p class="text-xs font-bold text-green-500">${c.name}</p>
                    <p class="text-[10px] text-zinc-500 mb-4">${c.description}</p>
                    <button onclick="joinCrew('${c.id}')" class="text-[9px] border border-green-900 px-2 py-1 hover:bg-green-900 hover:text-black font-bold uppercase">[ Request_Infiltration ]</button>
                </div>
            `).join('');
        }

        async function registerCrew() {
            const name = document.getElementById('crew-name').value;
            const description = document.getElementById('crew-desc').value;
            await supabase.from('crews').insert([{ name, description, leader_email: userEmail }]);
            location.reload();
        }

        async function joinCrew(crewId) {
            await supabase.from('crew_members').insert([{ crew_id: crewId, user_email: userEmail, status: 'PENDING' }]);
            alert("REQUEST SENT TO CREW LEADER.");
        }

        async function checkIfLeader() {
            const { data: leaderOf } = await supabase.from('crews').select('*').eq('leader_email', userEmail);
            if(leaderOf.length > 0) {
                document.getElementById('leader-section').classList.remove('hidden');
                loadPendingRequests(leaderOf[0].id);
            }
        }

        async function loadPendingRequests(crewId) {
            const { data: reqs } = await supabase.from('crew_members').select('*').eq('crew_id', crewId).eq('status', 'PENDING');
            document.getElementById('pending-requests').innerHTML = reqs.map(r => `
                <div class="flex justify-between items-center border border-zinc-800 p-2">
                    <span class="text-xs">${r.user_email}</span>
                    <button onclick="approveMember(${r.id})" class="bg-green-900 text-black text-[10px] font-bold px-2 py-1 uppercase">Approve</button>
                </div>
            `).join('');
        }

        async function approveMember(id) {
            await supabase.from('crew_members').update({ status: 'APPROVED' }).eq('id', id);
            location.reload();
        }

        function showTab(t) {
            ['tab-feed', 'tab-clubs', 'tab-admin'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById('tab-' + t).classList.remove('hidden');
            if(t === 'clubs') loadClubs();
        }

        checkUser();
        setInterval(loadFeed, 30000); // Auto refresh feed 30s
    </script>
</body>
</html>
