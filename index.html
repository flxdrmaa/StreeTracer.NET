<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StreetRacer.NET</title>
    
    <!-- TAILWIND & SUPABASE -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- FONT: VT323 (Terminal Font) -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { terminal: ['"VT323"', 'monospace'] },
                    colors: {
                        'neon-red': '#ff0000',
                        'dark-red': '#3a0000',
                    },
                    animation: {
                        'pulse-fast': 'pulse 0.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #000;
            color: #ff0000;
            font-family: 'VT323', monospace;
            /* Mencegah zoom saat double tap di HP */
            touch-action: manipulation; 
        }

        /* CUSTOM SCROLLBAR */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #500; border-radius: 3px; }

        /* INPUT STYLE */
        .terminal-input {
            background: rgba(255, 0, 0, 0.02);
            border: 1px solid #333;
            border-left: 2px solid #ff0000;
            color: #fff;
            font-family: 'VT323', monospace;
            font-size: 1.1rem; /* Ukuran pas di HP */
            width: 100%;
            padding: 10px;
            outline: none;
            transition: all 0.2s;
        }
        .terminal-input:focus {
            background: rgba(255, 0, 0, 0.1);
            border-color: #ff0000;
            box-shadow: 0 0 10px rgba(255,0,0,0.2);
        }
        .terminal-input::placeholder { color: #555; }

        /* BUTTON STYLE */
        .terminal-btn {
            background: #000;
            border: 1px solid #ff0000;
            color: #ff0000;
            text-transform: uppercase;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 12px;
            transition: 0.2s;
            position: relative;
            overflow: hidden;
        }
        .terminal-btn:hover {
            background: #ff0000;
            color: #000;
            box-shadow: 0 0 20px #ff0000;
            font-weight: bold;
        }
        .terminal-btn:disabled {
            border-color: #444; color: #444; box-shadow: none; cursor: not-allowed;
            background: #111;
        }

        /* GLITCH TEXT EFFECT FOR HEADER */
        .glitch-header {
            position: relative;
            color: white;
            text-shadow: 2px 0 #ff0000, -2px 0 #00ccff;
        }

        /* CRT SCANLINE EFFECT */
        .scanline {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 relative overflow-x-hidden">

    <!-- Efek TV Rusak Background -->
    <div class="fixed inset-0 pointer-events-none opacity-[0.05] bg-[url('https://grainy-gradients.vercel.app/noise.svg')] z-0"></div>
    <div class="scanline"></div>

    <!-- CONTAINER UTAMA (Responsive width) -->
    <div class="w-full max-w-lg z-10 border-t-4 border-b-4 border-neon-red bg-black/90 p-1 shadow-[0_0_50px_rgba(255,0,0,0.15)]">
        
        <!-- HEADER SECTION -->
        <div class="p-4 sm:p-6 text-center border-x border-zinc-900">
            
            <!-- LOGO TEXT (Ganti ASCII jadi text biar responsif di HP) -->
            <h1 class="text-4xl sm:text-6xl font-bold tracking-tighter glitch-header mb-2 leading-none">
                STREETRACER<span class="text-neon-red">.NET</span>
            </h1>


            <!-- CONNECTION STATUS -->
            <div class="flex justify-between items-center text-xs text-zinc-500 border-t border-b border-zinc-800 py-2 mt-4 font-mono">
                <span class="flex items-center gap-2">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse-fast"></span>
                    Deep Web
                </span>
                <span>V.0.0.1</span>
            </div>
        </div>

        <!-- NOTIFICATION BOX -->
        <div id="notif-area" class="mx-4 sm:mx-6 mb-4 text-sm hidden">
            <div id="notif-content" class="border p-2 font-mono flex items-start gap-2 bg-zinc-900">
                <!-- Content injected via JS -->
            </div>
        </div>

        <!-- NAVIGATION TABS -->
        <div class="flex text-lg sm:text-xl border-b border-zinc-800 mx-4 sm:mx-6 mb-6">
            <button onclick="switchMode('login')" id="nav-login" class="flex-1 py-2 text-white border-b-2 border-neon-red bg-zinc-900/50 transition-all">
                [ LOGIN ]
            </button>
            <button onclick="switchMode('register')" id="nav-reg" class="flex-1 py-2 text-zinc-600 border-b-2 border-transparent hover:text-white transition-all">
                [ REGISTER ]
            </button>
        </div>

        <!-- FORM CONTAINER -->
        <div class="px-4 sm:px-6 pb-8">
            
            <!-- LOGIN FORM -->
            <form id="form-login" class="space-y-5 block">
                <div class="space-y-1">
                    <label class="text-zinc-500 uppercase text-sm tracking-wider">> Email</label>
                    <input type="email" id="login-email" class="terminal-input" placeholder="driver@streetracer.net" required>
                </div>
                <div class="space-y-1">
                    <label class="text-zinc-500 uppercase text-sm tracking-wider">> Password</label>
                    <input type="password" id="login-password" class="terminal-input" placeholder="••••••••" required>
                </div>
                <button type="submit" id="btn-login" class="terminal-btn w-full mt-6 shadow-[0_0_10px_rgba(255,0,0,0.3)]">
                    > ACCESS_MAIN_FRAME
                </button>
            </form>

            <!-- REGISTER FORM -->
            <form id="form-register" class="space-y-5 hidden">
                <div class="bg-red-900/10 border border-red-900 text-red-400 p-2 text-xs mb-4">
                    WARNING: USE FAKE DETAILS. <br>WE ARE WATCHING.
                </div>
                
                <div class="space-y-1">
                    <label class="text-zinc-500 uppercase text-sm tracking-wider">> IC Name (SAMP)</label>
                    <input type="text" id="reg-icname" class="terminal-input" placeholder="Maximiliano Jose" required>
                </div>
                <div class="space-y-1">
                    <label class="text-zinc-500 uppercase text-sm tracking-wider">> Secure Email</label>
                    <input type="email" id="reg-email" class="terminal-input" placeholder="josjis@streetracer.net" required>
                </div>
                <div class="space-y-1">
                    <label class="text-zinc-500 uppercase text-sm tracking-wider">> Create Password</label>
                    <input type="password" id="reg-password" class="terminal-input" placeholder="••••••••" required>
                </div>
                <button type="submit" id="btn-reg" class="terminal-btn w-full mt-6">
                    > INITIATE_PROTOCOL
                </button>
            </form>

            <!-- FOOTER INFO -->
            <div class="mt-8 text-center">
                <p class="text-[10px] text-zinc-700 uppercase tracking-[0.2em]">
                    Restricted Area 51 // Los Santos
                </p>
            </div>

        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // ============================================
        // 1. CONFIGURATION (WAJIB DIISI)
        // ============================================
        const SUPABASE_URL = 'https://zgnfpqqvacixawymldnb.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_6NbWkN7jwYH5fpBggGQisQ_7HXDHrNi';
        
    // ============================================
    // 2. HELPER (Fungsi Bantuan Visual)
    // ============================================
    function showLog(msg, type='normal') {
        const area = document.getElementById('notif-area');
        const content = document.getElementById('notif-content');
        area.classList.remove('hidden');
        
        if(type === 'error') {
            content.className = "border p-2 font-mono flex items-center gap-2 bg-red-950/30 border-red-500 text-red-400";
            content.innerHTML = `<span class="text-xl">⚠️</span> <span>${msg}</span>`;
        } else if (type === 'success') {
            content.className = "border p-2 font-mono flex items-center gap-2 bg-green-950/30 border-green-500 text-green-400";
            content.innerHTML = `<span class="text-xl">✓</span> <span>${msg}</span>`;
        } else {
            content.className = "border p-2 font-mono flex items-center gap-2 bg-zinc-900 border-zinc-700 text-zinc-300";
            content.innerHTML = `<span>i</span> <span>${msg}</span>`;
        }
        if(type === 'success') setTimeout(() => area.classList.add('hidden'), 3000);
    }

    window.switchMode = function(mode) {
        document.getElementById('notif-area').classList.add('hidden');
        if(mode === 'login') {
            document.getElementById('form-login').classList.remove('hidden');
            document.getElementById('form-register').classList.add('hidden');
            document.getElementById('nav-login').className = "flex-1 py-2 text-white border-b-2 border-neon-red bg-zinc-900/50";
            document.getElementById('nav-reg').className = "flex-1 py-2 text-zinc-600 border-b-2 border-transparent";
        } else {
            document.getElementById('form-login').classList.add('hidden');
            document.getElementById('form-register').classList.remove('hidden');
            document.getElementById('nav-reg').className = "flex-1 py-2 text-white border-b-2 border-neon-red bg-zinc-900/50";
            document.getElementById('nav-login').className = "flex-1 py-2 text-zinc-600 border-b-2 border-transparent";
        }
    }

    // ============================================
    // 3. LOGIKA UTAMA
    // ============================================
    document.addEventListener('DOMContentLoaded', () => {
        if (!SUPABASE_URL || SUPABASE_URL.includes("MASUKKAN")) {
            showLog("ERROR: API KEY MISSING IN CODE!", "error"); return;
        }
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- LOGIN ---
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const defTxt = btn.innerText; btn.innerText = "> DECRYPTING..."; btn.disabled = true;

            const email = document.getElementById('login-email').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;

            try {
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if(error) throw error;
                showLog("ACCESS GRANTED.", "success");
                setTimeout(() => window.location.href = 'dashboard.html', 1500);
            } catch (err) {
                showLog(err.message, "error");
                btn.innerText = defTxt; btn.disabled = false;
            }
        });

        // --- REGISTER (DENGAN PROTEKSI IP & NAMA) ---
        document.getElementById('form-register').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-reg');
            const defTxt = btn.innerText; btn.innerText = "> VERIFYING..."; btn.disabled = true;

            const icName = document.getElementById('reg-icname').value.trim();
            const email = document.getElementById('reg-email').value.trim().toLowerCase();
            const password = document.getElementById('reg-password').value;

            try {
                // ---------------------------------------------------------
                // RULE 1: VALIDASI NAMA TIDAK BOLEH ASAL (REGEX)
                // ---------------------------------------------------------
                // Penjelasan: 
                // ^[A-Z][a-z]+  -> Kata depan: Awal Kapital, sisa kecil
                // [ ]           -> WAJIB SPASI
                // [A-Z][a-z]+$  -> Kata belakang: Awal Kapital, sisa kecil
                const nameRegex = /^[A-Z][a-z]+ [A-Z][a-z]+$/;
                
                if (!nameRegex.test(icName)) {
                    throw new Error("INVALID NAME. Format: 'NamaDepan NamaBelakang' (Ex: Dominic Toretto)");
                }

                // ---------------------------------------------------------
                // RULE 2: SATU IP SATU AKUN
                // ---------------------------------------------------------
                // A. Ambil IP User saat ini
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const { ip } = await ipRes.json();
                
                // B. Cek ke Database Supabase: "Adakah IP ini?"
                const { data: existingIP, error: ipCheckError } = await supabase
                    .from('profiles')
                    .select('ip_address')
                    .eq('ip_address', ip);

                // C. Jika data ditemukan (panjang array > 0), tolak.
                if (existingIP && existingIP.length > 0) {
                    throw new Error("ACCESS DENIED: IP ADDRESS ALREADY REGISTERED.");
                }

                // ---------------------------------------------------------
                // PROSES REGISTER
                // ---------------------------------------------------------
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: { 
                        data: { ic_name: icName } // Simpan nama di metadata dulu
                    }
                });

                if(error) throw error;

                // UPDATE PROFILE: Simpan IP User ke database agar tidak bisa daftar lagi
                if(data.user) {
                     await supabase.from('profiles').update({ ip_address: ip }).eq('id', data.user.id);
                }

                showLog("IDENTITY CREATED. IP LOGGED.", "success");
                setTimeout(() => { window.switchMode('login'); btn.innerText = defTxt; btn.disabled = false; }, 2000);

            } catch (err) {
                showLog(err.message, "error");
                btn.innerText = defTxt; btn.disabled = false;
            }
        });
    });
</script>
</body>
</html>
