<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StreetRacer.NET</title>
    
    <!-- LIBRARIES -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { terminal: ['"VT323"', 'monospace'] },
                    colors: { 'neon-red': '#ff0000', 'term-bg': '#050505' },
                    animation: { 'pulse-fast': 'pulse 0.5s cubic-bezier(0.4, 0, 0.6, 1) infinite' }
                }
            }
        }
    </script>
    <style>
        body { background: #000; color: #ff0000; font-family: 'VT323', monospace; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #500; border: 1px solid #000; }
        
        .term-card { background: #050505; border: 1px solid #333; border-left: 2px solid #ff0000; margin-bottom: 1rem; }
        .term-header { background: #111; padding: 4px 8px; font-size: 0.9rem; color: #888; border-bottom: 1px solid #333; }
        .term-btn { border: 1px solid #333; background: #000; color: #888; text-transform: uppercase; padding: 4px 12px; cursor: pointer; transition: 0.2s; }
        .term-btn:hover { border-color: #ff0000; color: #ff0000; }
        .term-btn.active { background: #ff0000; color: #000; border-color: #ff0000; font-weight: bold; }
        
        .scanline { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%); background-size: 100% 4px; pointer-events: none; z-index: 30; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div class="fixed inset-0 pointer-events-none opacity-[0.05] bg-[url('https://grainy-gradients.vercel.app/noise.svg')] z-0"></div>
    <div class="scanline"></div>

    <!-- NAVBAR -->
    <nav class="h-14 border-b border-zinc-900 bg-black sticky top-0 z-50 flex items-center justify-between px-4 shadow-lg shadow-red-900/10">
        <h1 class="text-2xl font-bold tracking-widest text-white cursor-default">STREETRACER<span class="text-neon-red">.NET</span></h1>
        
        <div class="flex items-center gap-4">
            <!-- NAMA USER DI SINI -->
            <div class="text-right leading-none hidden sm:block">
                <div id="nav-ic-name" class="text-lg text-white font-bold">LOADING...</div>
                <div class="text-[10px] text-zinc-500">OPERATIVE</div>
            </div>
            
            <!-- TOMBOL LOGOUT FIX -->
            <button onclick="handleLogout()" class="term-btn text-xs hover:bg-red-900 hover:text-white transition-colors border-red-900 text-red-500">
                [ LOGOUT ]
            </button>
        </div>
    </nav>

    <!-- LAYOUT GRID -->
    <div class="flex-1 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-4 gap-4 p-4 relative z-40">
        
        <!-- SIDEBAR KIRI -->
        <aside class="hidden lg:block lg:col-span-1 space-y-4 h-[calc(100vh-100px)] overflow-y-auto pr-2">
            <div class="term-card p-4 text-center">
                <i data-lucide="user" class="w-10 h-10 mx-auto text-zinc-600 mb-2"></i>
                <h2 id="side-ic-name" class="text-xl text-white leading-none">...</h2>
                <div class="text-zinc-500 text-sm mt-2 pt-2 border-t border-zinc-900">STATUS: ONLINE</div>
            </div>
            <div class="term-card">
                <div class="term-header flex justify-between items-center">
                    <span>> KNOWN_CREWS</span>
                    <button onclick="openCreateClubModal()" class="text-xs text-neon-red hover:underline hover:text-white">[ + NEW ]</button>
                </div>
                <div id="club-list" class="flex flex-col">
                    <div class="p-4 text-center text-zinc-600 text-sm">SCANNING...</div>
                </div>
            </div>
        </aside>

        <!-- TENGAH: FEED -->
        <main class="lg:col-span-2 space-y-4 pb-20">
            <div class="term-card p-4">
                <div class="flex gap-2 mb-2 text-zinc-500 text-sm"><span>> BROADCAST_MESSAGE</span><span class="animate-pulse-fast">_</span></div>
                <textarea id="post-content" class="w-full bg-black border border-zinc-800 text-white p-2 outline-none focus:border-red-500" rows="2" placeholder="Write encrypted message..."></textarea>
                <div id="img-input-area" class="hidden mt-2 border-l-2 border-zinc-800 pl-2">
                    <input type="text" id="post-img-url" class="w-full bg-black border border-zinc-800 text-white p-1 text-sm" placeholder="Image URL (https://...)">
                </div>
                <div class="flex justify-between items-center mt-2">
                    <button onclick="document.getElementById('img-input-area').classList.toggle('hidden')" class="text-zinc-500 hover:text-white text-sm">[ + IMG ]</button>
                    <button id="btn-post" class="term-btn text-white border-red-900 bg-red-900/10 hover:bg-red-900">> SEND</button>
                </div>
            </div>
            <div id="feed-container" class="space-y-4">
                <div class="text-center py-8 text-zinc-600">> DECRYPTING_DATA...</div>
            </div>
        </main>

        <!-- KANAN: WIDGET -->
        <aside class="hidden lg:block lg:col-span-1">
            <div class="term-card p-3">
                <div class="text-red-500 mb-2 blink-text">>> POLICE_SCANNER</div>
                <div class="text-zinc-400 text-sm border-b border-zinc-800 pb-2 mb-2">
                    <span class="text-white">10-90 REPORTED</span><br>Suspicious activity near Grove Street.
                </div>
            </div>
        </aside>
    </div>

    <!-- MODALS -->
    <!-- 1. DETAIL CLUB -->
    <div id="modal-club-info" class="modal-overlay hidden">
        <div class="term-card w-full max-w-md p-6 shadow-[0_0_50px_rgba(255,0,0,0.2)]">
            <div class="flex justify-between items-start mb-4 border-b border-zinc-800 pb-2">
                <h2 id="modal-club-name" class="text-2xl text-white font-bold">CLUB</h2>
                <button onclick="closeModals()" class="text-zinc-500 hover:text-red-500">[X]</button>
            </div>
            <div class="space-y-4 mb-6">
                <div><div class="text-zinc-500 text-xs">DESCRIPTION</div><div id="modal-club-desc" class="text-zinc-300 text-sm mt-1">...</div></div>
                <div class="flex gap-4">
                    <div><div class="text-zinc-500 text-xs">LEADER</div><div id="modal-club-leader" class="text-white text-sm">UNKNOWN</div></div>
                    <div><div class="text-zinc-500 text-xs">MEMBERS</div><div id="modal-club-count" class="text-white text-sm">0</div></div>
                </div>
                <div id="modal-club-status" class="p-2 border border-zinc-800 bg-zinc-900 text-center text-xs text-zinc-400 hidden">STATUS: NONE</div>
            </div>
            <div class="flex justify-end gap-2">
                <button onclick="closeModals()" class="term-btn text-zinc-500 border-zinc-800">CANCEL</button>
                <button id="btn-join-club" class="term-btn active">REQUEST_ACCESS</button>
            </div>
        </div>
    </div>

    <!-- 2. CREATE CLUB -->
    <div id="modal-create-club" class="modal-overlay hidden">
        <div class="term-card w-full max-w-md p-6">
            <h2 class="text-xl text-white mb-4 border-b border-zinc-800 pb-2">> ESTABLISH_NEW_CREW</h2>
            <div class="space-y-3 mb-6">
                <div><label class="text-xs text-zinc-500">CREW_NAME</label><input type="text" id="input-crew-name" class="w-full bg-black border border-zinc-800 text-white p-2 outline-none focus:border-red-500"></div>
                <div><label class="text-xs text-zinc-500">MISSION</label><textarea id="input-crew-desc" class="w-full bg-black border border-zinc-800 text-white p-2 outline-none focus:border-red-500" rows="3"></textarea></div>
            </div>
            <div class="flex justify-end gap-2">
                <button onclick="closeModals()" class="term-btn text-zinc-500 border-zinc-800">ABORT</button>
                <button onclick="submitCreateClub()" class="term-btn active">ESTABLISH</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT UTAMA -->
    <script>
        lucide.createIcons();

        // 1. DATA API (Gunakan yang ini agar tidak perlu edit manual)
        const SUPABASE_URL = 'https://zgnfpqqvacixawymldnb.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_6NbWkN7jwYH5fpBggGQisQ_7HXDHrNi'; 
        const DISCORD_WEBHOOK = 'https://discord.com/api/webhooks/1450862700736413887/pScPkMGmyFiHTQpZMBB9_tGS14pgjtxQ6cyhHqq7j0aOOgwpvJVQLoIQeu8hDm4ZUNZZ'; 

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let currentUser = null;

        // 2. INIT & FIX NAMA USER
        async function init() {
            const { data: { session } } = await supabase.auth.getSession();
            
            if (!session) { 
                window.location.href = 'index.html'; 
                return; 
            }
            currentUser = session.user;

            // Prioritas: Ambil Nama dari Metadata User (Lebih cepat & pasti ada saat register)
            let finalName = "UNKNOWN";
            if (currentUser.user_metadata && currentUser.user_metadata.ic_name) {
                finalName = currentUser.user_metadata.ic_name;
            } 
            // Fallback: Ambil dari table profiles kalau metadata kosong
            else {
                const { data: profile } = await supabase.from('profiles').select('ic_name').eq('id', currentUser.id).single();
                if(profile) finalName = profile.ic_name;
            }
            
            // Simpan nama agar bisa dipakai di fungsi lain
            currentUser.ic_name = finalName; 

            // Tampilkan di Navbar & Sidebar
            document.getElementById('nav-ic-name').innerText = finalName.toUpperCase();
            document.getElementById('side-ic-name').innerText = finalName;

            fetchFeed();
            fetchClubs();
        }

        // 3. FIX LOGOUT (Paksa pindah halaman)
        window.handleLogout = async function() {
            const btn = document.querySelector('button[onclick="handleLogout()"]');
            btn.innerText = "DISCONNECTING...";
            
            // Set timer: Jika supabase signOut kelamaan (lebih dari 1 detik), paksa pindah
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1000);

            try {
                await supabase.auth.signOut();
                window.location.href = 'index.html';
            } catch (err) {
                console.log("Logout error ignored", err);
                window.location.href = 'index.html';
            }
        }

        // 4. FIX POSTING FEED
        document.getElementById('btn-post').addEventListener('click', async () => {
            const content = document.getElementById('post-content').value;
            const imgUrl = document.getElementById('post-img-url').value;
            const btn = document.getElementById('btn-post');

            if(!content && !imgUrl) return alert("DATA EMPTY!");

            btn.innerText = "SENDING...";
            btn.disabled = true;

            // Insert ke DB
            const { error } = await supabase.from('posts').insert({
                user_id: currentUser.id,
                ic_name: currentUser.ic_name, // Menggunakan nama yang sudah difix di init()
                content: content,
                image_url: imgUrl || null
            });

            if(error) {
                alert("ERROR UPLOAD: " + error.message);
                btn.innerText = "> SEND";
                btn.disabled = false;
                return;
            }

            // Webhook Discord
            if(DISCORD_WEBHOOK && DISCORD_WEBHOOK.startsWith('http')) {
                fetch(DISCORD_WEBHOOK, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
                    username: "DeepWeb", embeds: [{ title: currentUser.ic_name, description: content, color: 15158332, image: { url: imgUrl || null } }]
                })}).catch(()=>{});
            }

            // Reset Form
            document.getElementById('post-content').value = '';
            document.getElementById('post-img-url').value = '';
            document.getElementById('img-input-area').classList.add('hidden');
            btn.innerText = "> SEND";
            btn.disabled = false;
            fetchFeed();
        });

        // 5. LOAD FEED
        async function fetchFeed() {
            const container = document.getElementById('feed-container');
            const { data: posts, error } = await supabase.from('posts').select('*, post_likes(user_id)').order('created_at', { ascending: false }).limit(20);
            
            if (error) return; 
            container.innerHTML = '';

            posts.forEach(post => {
                const isLiked = post.post_likes && post.post_likes.some(l => l.user_id === currentUser.id);
                // Hitung jumlah like manual dari array
                const likeCount = post.post_likes ? post.post_likes.length : 0; 
                
                const imgHtml = post.image_url ? `<img src="${post.image_url}" class="mt-2 w-full border border-zinc-800 opacity-90">` : '';

                const html = `
                <div class="term-card p-3 animate-[pulse_0.2s_ease-in]">
                    <div class="flex justify-between items-start mb-2 border-b border-zinc-900 pb-2">
                        <div><span class="text-white font-bold text-lg">${post.ic_name}</span></div>
                    </div>
                    <div class="text-zinc-300 whitespace-pre-wrap font-sans font-normal" style="font-family: 'VT323'">${post.content}</div>
                    ${imgHtml}
                    <div class="mt-3 flex gap-2 border-t border-zinc-900 pt-2">
                        <button onclick="toggleLike('${post.id}')" id="btn-like-${post.id}" class="term-btn flex-1 text-center ${isLiked ? 'active' : ''}">LIKE (${likeCount})</button>
                    </div>
                </div>`;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        async function toggleLike(postId) {
            const btn = document.getElementById(`btn-like-${postId}`);
            const isLiked = btn.classList.contains('active');
            let count = parseInt(btn.innerText.match(/\d+/)[0]);
            
            if (isLiked) {
                btn.classList.remove('active'); btn.innerText = `LIKE (${count - 1})`;
                await supabase.from('post_likes').delete().match({ user_id: currentUser.id, post_id: postId });
            } else {
                btn.classList.add('active'); btn.innerText = `LIKE (${count + 1})`;
                await supabase.from('post_likes').insert({ user_id: currentUser.id, post_id: postId });
            }
        }

        // 6. FIX CREATE CLUB
        async function fetchClubs() {
            const list = document.getElementById('club-list');
            const { data: crews, error } = await supabase.from('crews').select('*').order('created_at', { ascending: false });

            list.innerHTML = '';
            if(!crews || crews.length === 0) {
                list.innerHTML = '<div class="p-4 text-center text-xs text-zinc-600">NO CLUBS FOUND.</div>';
                return;
            }

            crews.forEach(crew => {
                const item = document.createElement('div');
                item.className = "p-3 border-b border-zinc-900 hover:bg-zinc-900 cursor-pointer transition flex justify-between items-center group";
                item.innerHTML = `
                    <div>
                        <div class="text-white font-bold group-hover:text-red-500 text-sm">[ ${crew.name} ]</div>
                        <div class="text-[10px] text-zinc-600 truncate w-32">${crew.description || 'No data'}</div>
                    </div>
                    <span class="text-zinc-700 text-xs group-hover:text-white">></span>
                `;
                item.onclick = () => openClubDetail(crew.id, crew.name, crew.description, crew.created_by);
                list.appendChild(item);
            });
        }

        async function submitCreateClub() {
            const name = document.getElementById('input-crew-name').value.trim();
            const desc = document.getElementById('input-crew-desc').value.trim();
            
            if(!name) return alert("NAME REQUIRED");

            // 1. Create Club
            const { data: crew, error } = await supabase.from('crews').insert({
                name: name,
                description: desc,
                created_by: currentUser.id // Pastikan kolom created_by ada di SQL
            }).select().single();

            if(error) return alert("FAILED: " + error.message);

            // 2. Add Self as Leader
            await supabase.from('crew_members').insert({
                crew_id: crew.id,
                user_id: currentUser.id,
                ic_name: currentUser.ic_name,
                status: 'leader'
            });

            alert("CREW ESTABLISHED.");
            closeModals();
            fetchClubs();
        }

        async function openClubDetail(id, name, desc, creatorId) {
            document.getElementById('modal-club-info').classList.remove('hidden');
            document.getElementById('modal-club-name').innerText = name;
            document.getElementById('modal-club-desc').innerText = desc || "-";
            
            const btnJoin = document.getElementById('btn-join-club');
            btnJoin.disabled = false; btnJoin.innerText = "REQUEST ACCESS";
            btnJoin.onclick = () => joinCrew(id);

            // Load Leader Name
            // Fallback sederhana jika profile leader belum ada
            let leaderName = "UNKNOWN";
            const { data: leader } = await supabase.from('profiles').select('ic_name').eq('id', creatorId).single();
            if(leader) leaderName = leader.ic_name;
            document.getElementById('modal-club-leader').innerText = leaderName;

            // Load Member Count
            const { count } = await supabase.from('crew_members').select('*', { count: 'exact', head: true }).eq('crew_id', id);
            document.getElementById('modal-club-count').innerText = count || 0;

            // Check Status
            const { data: myStatus } = await supabase.from('crew_members').select('status').eq('crew_id', id).eq('user_id', currentUser.id).single();
            const statusEl = document.getElementById('modal-club-status');
            
            if(myStatus) {
                btnJoin.disabled = true;
                btnJoin.innerText = myStatus.status === 'pending' ? "PENDING" : "JOINED";
                statusEl.innerText = "STATUS: " + myStatus.status.toUpperCase();
                statusEl.classList.remove('hidden');
            } else {
                statusEl.classList.add('hidden');
            }
        }

        async function joinCrew(crewId) {
            const btn = document.getElementById('btn-join-club');
            btn.innerText = "..."; btn.disabled = true;
            const { error } = await supabase.from('crew_members').insert({ crew_id: crewId, user_id: currentUser.id, ic_name: currentUser.ic_name, status: 'pending' });
            if(error) { alert(error.message); btn.disabled = false; }
            else { alert("REQUEST SENT"); btn.innerText = "PENDING"; }
        }

        function closeModals() { document.querySelectorAll('.modal-overlay').forEach(el => el.classList.add('hidden')); }
        function openCreateClubModal() { document.getElementById('modal-create-club').classList.remove('hidden'); }

        init();
    </script>
</body>
</html>
